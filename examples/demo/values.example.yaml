# context is a recommended way to define user-provided free form data to be
# used in templates
context:
  contextVariable: contextVariableValue

deployments:
  main:
    #: Explicitly enable the resource
    enabled: true

    #: Facts about the resource, see $.Metachart.Resource.context in
    #: settings.deployments.defaults below (default role is `app`)
    context:
      role: frontend

    related:
      #: Create a service linked with the main Deployment
      services:
        main:
          spec:
            ports:
              - name: http
                port: 80
                targetPort: 80
                protocol: TCP

    #: Resource definition
    metadata:
      labels:
        resource-label: resource-label-value
    spec:
      pod:
        metadata:
          checksums:
            #: Restart Deployment pods on the `main` configmap change
            configmaps:
              - main
        spec:
          containers:
            - name: main
              image: nginx:latest

configmaps:
  main:
    data:
      #: Template including the context.contextVariable variable
      FROM_CONTEXT: "{{ $.Values.context.contextVariable }}"

settings:
  global:
    labels: {}
    annotations: {}

  configmaps:
    #: Explicitly enable resources kind
    disabled: false
  deployments:
    defaults:
      #: Default resource context, merged under the resource's own `context`
      context:
        role: app
      metadata:
        annotations:
          #: Templates of the resource see its context
          example.metachart.iponweb.net/role: '{{ $.Metachart.Resource.context.role }}'
      spec:
        pod:
          metadata:
            #: By default - restart on any configmaps change
            checksums:
              configmaps: "*"
  services: {}
