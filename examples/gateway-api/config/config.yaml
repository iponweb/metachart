apiVersion: metachart.iponweb.net/v1alpha1
kind: MetachartConfig
metadata:
  name: gateway-api
spec:
  schema:
    rules:
      #: meta.v1.ObjectMeta — common metadata used by all resources
      - target: metachart.api.meta.v1.ObjectMeta
        source: io.k8s.apimachinery.pkg.apis.meta.v1.ObjectMeta
        allowed:
          - annotations
          - labels
          - finalizers
          - namespace
          - name
        properties:
          checksums: metachart.interface.checksums

  autodiscover:
    - version: "v1.5.1"
      discovery: "https://raw.githubusercontent.com/iponweb/schemas/refs/heads/main/schemas/kubernetes-sigs/gateway-api/{{ .version }}/discovery/apis.json"
      definitions: "https://raw.githubusercontent.com/iponweb/schemas/refs/heads/main/schemas/kubernetes-sigs/gateway-api/{{ .version }}/json-schema/source/_definitions.json"
      #: Include only stable v1 resources
      include:
        - apiVersion: "gateway.networking.k8s.io/v1"
          kind:
            - "*"
